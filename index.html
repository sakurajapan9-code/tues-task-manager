<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TUES Office — Project Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root{--bg:#F7F5F2;--surface:#FFFFFF;--border:#E5E2DC;--text:#1A1916;--muted:#7A776F;--light:#B0ADA6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.05);}
  .logo{font-size:17px;font-weight:600;color:var(--text);flex:1;display:flex;align-items:center;gap:10px;}
  .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#7F77DD,#378ADD);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px rgba(127,119,221,.35);}
  .logo span{color:#7F77DD;}
  .tabs{display:flex;gap:4px;background:var(--bg);border-radius:99px;padding:4px;}
  .tab{padding:7px 18px;border-radius:99px;border:none;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s;font-family:'DM Sans',sans-serif;}
  .tab.active{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .t-daily.active{background:#1D9E75;}.t-monthly.active{background:#378ADD;}.t-annual.active{background:#D4860B;}.t-all.active{background:#7F77DD;}

  .main{max-width:980px;margin:0 auto;padding:24px 20px;}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px;}
  .stat{border-radius:10px;padding:12px 14px;}
  .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .stat-val{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;}
  .s-purple{background:#F0EFFE;}.s-purple .stat-label{color:#534AB7;}.s-purple .stat-val{color:#3C3489;}
  .s-teal{background:#E8F8F2;}.s-teal .stat-label{color:#0F6E56;}.s-teal .stat-val{color:#085041;}
  .s-blue{background:#EEF5FD;}.s-blue .stat-label{color:#185FA5;}.s-blue .stat-val{color:#0C447C;}
  .s-red{background:#FFF0F0;}.s-red .stat-label{color:#A32D2D;}.s-red .stat-val{color:#791F1F;}
  .s-amber{background:#FEF4E4;}.s-amber .stat-label{color:#854F0B;}.s-amber .stat-val{color:#633806;}

  .proj-progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:20px;}
  .proj-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;border-top:3px solid #ccc;}
  .pc-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .pc-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
  .pc-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;}
  .pc-short{font-size:11px;color:var(--muted);}
  .pc-counts{display:flex;justify-content:space-between;margin-bottom:8px;}
  .pc-count{text-align:center;}
  .pc-count-val{font-size:18px;font-weight:600;font-family:'DM Mono',monospace;}
  .pc-count-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .pc-bar-wrap{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
  .pc-bar{height:100%;border-radius:99px;transition:width .4s ease;}
  .pc-pct{font-size:11px;font-weight:600;text-align:right;margin-top:4px;}

  .reminder{background:#FEF4E4;border:1px solid #FAC775;border-radius:10px;padding:12px 16px;margin-bottom:16px;}
  .rem-title{font-size:13px;font-weight:600;color:#633806;margin-bottom:6px;}
  .rem-item{font-size:13px;color:#854F0B;padding:3px 0;display:flex;align-items:center;gap:6px;}
  .rem-item::before{content:'⚠';font-size:11px;}

  .add-form{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .add-form-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .add-form-title-icon{width:28px;height:28px;background:linear-gradient(135deg,#1D9E75,#378ADD);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;box-shadow:0 2px 6px rgba(29,158,117,.3);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;}
  .form-input{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;width:100%;transition:border-color .15s;}
  .form-input:focus{outline:none;border-color:#7F77DD;}
  .form-row .form-input{flex:1;min-width:110px;}
  .add-btn{padding:9px 22px;border-radius:99px;border:none;background:#7F77DD;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;white-space:nowrap;}
  .add-btn:hover{background:#534AB7;}
  .manage-btn{padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;}
  .manage-btn:hover{border-color:#7F77DD;color:#7F77DD;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;width:min(480px,92vw);max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18);}
  .modal-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);padding:2px 6px;border-radius:6px;}
  .modal-close:hover{background:var(--bg);}
  .modal-section{margin-bottom:18px;}
  .modal-section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
  .modal-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .modal-list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
  .modal-list-item-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .modal-list-item-name{flex:1;font-size:13px;font-weight:500;}
  .modal-list-item-del{background:none;border:none;cursor:pointer;color:var(--light);font-size:14px;padding:2px 5px;border-radius:5px;}
  .modal-list-item-del:hover{background:#FFF0F0;color:#A32D2D;}
  .modal-add-row{display:flex;gap:8px;}
  .modal-add-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;}
  .modal-add-row input:focus{outline:none;border-color:#7F77DD;}
  .color-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .color-swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .1s;}
  .color-swatch.selected{border-color:var(--text);}
  .mini-add-btn{padding:8px 14px;border-radius:8px;border:none;background:#7F77DD;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .mini-add-btn:hover{background:#534AB7;}

  .filter-section{margin-bottom:14px;}
  .filter-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--light);margin-bottom:6px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:5px 13px;border-radius:99px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .15s;font-family:'DM Sans',sans-serif;}
  .chip:hover{border-color:#aaa;color:var(--text);}

  .task-list{display:flex;flex-direction:column;gap:6px;}
  .task-card{background:var(--surface);border-radius:10px;border-left:4px solid #ccc;padding:11px 14px;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:box-shadow .15s;}
  .task-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07);}
  .task-card.done{opacity:.4;}
  .task-main{display:flex;align-items:center;gap:12px;}
  .task-card input[type=checkbox]{width:17px;height:17px;flex-shrink:0;cursor:pointer;accent-color:#1D9E75;}
  .task-info{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-card.done .task-title{text-decoration:line-through;color:var(--light);}
  .task-meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;}
  .b-daily{background:#E8F8F2;color:#085041;}.b-monthly{background:#EEF5FD;color:#0C447C;}.b-annual{background:#FEF4E4;color:#633806;}.b-person{background:#F0EFFE;color:#3C3489;}
  .b-time{background:#FFF0F0;color:#A32D2D;font-weight:700;}
  .due-ok{font-size:11px;color:var(--light);}.due-soon{font-size:11px;color:#854F0B;font-weight:600;}.due-over{font-size:11px;color:#A32D2D;font-weight:600;}
  .task-btns{display:flex;gap:2px;flex-shrink:0;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--light);font-size:15px;padding:4px 6px;border-radius:6px;transition:all .15s;}
  .icon-btn:hover{background:var(--bg);color:var(--text);}
  .icon-btn.del:hover{background:#FFF0F0;color:#A32D2D;}

  .edit-panel{display:none;border-top:1px solid var(--border);margin-top:10px;padding-top:10px;}
  .edit-panel.open{display:block;}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
  .edit-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
  .edit-input{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;width:100%;}
  .edit-input:focus{outline:none;border-color:#7F77DD;}
  .edit-row .edit-input{flex:1;min-width:100px;}
  .save-btn{padding:7px 16px;border-radius:8px;border:none;background:#1D9E75;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .save-btn:hover{background:#0F6E56;}
  .cancel-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}

  .section-divider{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--light);padding:10px 2px 4px;}
  .empty{text-align:center;padding:3rem;color:var(--light);font-size:14px;}

  @media(max-width:600px){
    .stats{grid-template-columns:repeat(3,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .header{padding:12px 16px;}
    .main{padding:16px 12px;}
    .proj-progress-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-chart-dots-3"></i></div>
    TUES Office — <span>Project Task Manager</span>
  </div>
  <div class="tabs">
    <button class="tab t-daily active" onclick="setView('daily')"><i class="ti ti-sun"></i> Daily</button>
    <button class="tab t-monthly" onclick="setView('monthly')"><i class="ti ti-calendar"></i> Monthly</button>
    <button class="tab t-annual" onclick="setView('annual')"><i class="ti ti-calendar-stats"></i> Annual</button>
    <button class="tab t-all" onclick="setView('all')"><i class="ti ti-list"></i> All</button>
  </div>
</div>

<div class="main">
  <div class="stats" id="stats"></div>
  <div class="proj-progress-grid" id="projProgressGrid"></div>
  <div id="reminder"></div>

  <div class="add-form">
    <div class="add-form-title">
      <div class="add-form-title-icon"><i class="ti ti-pencil-plus"></i></div>
      New Task
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="manage-btn" onclick="openModal('projects')"><i class="ti ti-folder-plus"></i> Add Project</button>
        <button class="manage-btn" onclick="openModal('staff')"><i class="ti ti-user-plus"></i> Add Staff</button>
        <button class="manage-btn" onclick="resetToDefault()" style="border-color:#E24B4A;color:#E24B4A;" title="Clear saved data and reload default tasks"><i class="ti ti-refresh"></i> Reset Tasks</button>
      </div>
    </div>
    <div class="form-grid">
      <input type="text" id="nTitle" class="form-input" placeholder="Task description…" onkeydown="if(event.key==='Enter'){event.preventDefault();addTask();}"/>
      <select id="nProj" class="form-input"></select>
    </div>
    <div class="form-row">
      <select id="nFreq" class="form-input">
        <option value="daily">Daily</option>
        <option value="monthly">Monthly</option>
        <option value="annual">Annual</option>
      </select>
      <select id="nPerson" class="form-input"></select>
      <input type="date" id="nDue" class="form-input"/>
      <input type="time" id="nTime" class="form-input" title="Set time for this task"/>
      <button class="add-btn" onclick="addTask()"><i class="ti ti-plus"></i> Add Task</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Filter by project</div>
    <div class="chips" id="projChips"></div>
  </div>
  <div class="filter-section">
    <div class="filter-label">Filter by team member</div>
    <div class="chips" id="memberChips"></div>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">Manage</span>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const PALETTE=['#E24B4A','#D4860B','#1D9E75','#378ADD','#7F77DD','#C0589E','#5BAD8F','#E07B39','#5B8DD9','#888780'];

let projects=[
  {id:'p1',name:'NCUK Alvis Pathway',   color:'#E24B4A',bg:'#FFF0F0',short:'NCUK',  icon:'ti-school'},
  {id:'p2',name:'International Affairs',color:'#378ADD',bg:'#EEF5FD',short:'Intl',  icon:'ti-world'},
  {id:'p3',name:'Accreditation',        color:'#1D9E75',bg:'#E8F8F2',short:'Accred',icon:'ti-certificate'},
  {id:'p4',name:'UCLA Migration',       color:'#D4860B',bg:'#FEF4E4',short:'UCLA',  icon:'ti-map-pin'},
  {id:'p5',name:'IICAS Album',          color:'#7F77DD',bg:'#F0EFFE',short:'IICAS', icon:'ti-book'},
  {id:'p6',name:'Private',              color:'#C0589E',bg:'#FCEEF8',short:'Priva',  icon:'ti-home'},
];
let staff=['Me','Staff 1','Staff 2','Staff 3'];

const today=new Date(); today.setHours(0,0,0,0);
let view='daily',activeProj='All',activeMember='All',nextId=50,editingId=null;
let newProjColor=PALETTE[0],modalMode='projects';

let tasks=[
  // From screenshots — NCUK tasks
  {id:1, title:'Send a marketing plan and accommodation information send it Amna', project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-04', time:'09:00', done:false},
  {id:2, title:'Make a video for NCUK and send it Amna',                          project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-06', time:'10:00', done:false},
  {id:3, title:'Talk to LC directors and set a date for open day',                project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-06', time:'11:00', done:false},
  {id:4, title:'Set a date for open day',                                         project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-06', time:'14:00', done:false},
  {id:5, title:'Make video for NCUK with Denna and Imomali',                      project:'NCUK Alvis Pathway',    freq:'daily', person:'Staff 3', due:'2026-06-06', time:'15:00', done:false},
  {id:6, title:'Talk to the teachers and set a date, inform Sam',                 project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-09', time:'10:00', done:false},
  {id:7, title:'Read the AC guide',                                               project:'NCUK Alvis Pathway',    freq:'daily', person:'Me',     due:'2026-06-10', time:'09:00', done:false},
  // UCLA tasks
  {id:8, title:'Give Mavlyuda opa all the audios',                                project:'UCLA Migration',        freq:'daily', person:'Me',     due:'2026-06-04', time:'09:30', done:false},
  {id:9, title:'Make the transcriptions',                                         project:'UCLA Migration',        freq:'daily', person:'Me',     due:'2026-06-04', time:'11:00', done:false},
  // International Affairs
  {id:10,title:'Monitor the accreditation offers and respond all of them',        project:'International Affairs', freq:'daily', person:'Staff 2', due:'2026-06-04', time:'10:00', done:false},
  // Private tasks
  {id:11,title:'Order high heels, slippers, renew my old order',                  project:'Private',               freq:'daily', person:'Me',     due:'2026-06-04', time:'12:00', done:false},
  {id:12,title:'Wash the car',                                                    project:'Private',               freq:'daily', person:'Me',     due:'2026-06-04', time:'13:00', done:false},
  {id:13,title:'Fix the cold water account at Termez flat',                       project:'Private',               freq:'daily', person:'Me',     due:'2026-06-05', time:'10:00', done:false},
  {id:14,title:'Fix the door, plug-ins, change the water tap',                    project:'Private',               freq:'daily', person:'Me',     due:'2026-06-07', time:'10:00', done:false},
  {id:15,title:'Fertilize the plants',                                            project:'Private',               freq:'daily', person:'Me',     due:'2026-06-07', time:'08:00', done:false},
  {id:16,title:'Take all the unnecessary rugs to my aunts flat',                  project:'Private',               freq:'daily', person:'Me',     due:'2026-06-07', time:'16:00', done:false},
  {id:17,title:'Renew the countertop in the kitchen',                             project:'Private',               freq:'daily', person:'Me',     due:'2026-06-08', time:'',     done:false},
  {id:18,title:'Dye my hair',                                                     project:'Private',               freq:'daily', person:'Me',     due:'2026-06-11', time:'11:00', done:false},
  {id:19,title:'Change the dirty wallpapers',                                     project:'Private',               freq:'daily', person:'Me',     due:'2026-06-13', time:'',     done:false},
  {id:20,title:'Send all the things to Termez from Tashkent flat',                project:'Private',               freq:'daily', person:'Me',     due:'2026-06-27', time:'',     done:false},
];
nextId=21;

function getProjByName(name){return projects.find(p=>p.name===name)||{color:'#888',bg:'#eee',short:(name||'?').substring(0,5),icon:'ti-folder'};}
function hexToBg(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},0.12)`;}

const APP_VERSION='2026-06-04-v3';

function saveData(){
  try{
    localStorage.setItem('tues_tasks',JSON.stringify(tasks));
    localStorage.setItem('tues_projects',JSON.stringify(projects));
    localStorage.setItem('tues_staff',JSON.stringify(staff));
    localStorage.setItem('tues_nextId',String(nextId));
    localStorage.setItem('tues_version',APP_VERSION);
  }catch(e){}
}
function loadData(){
  try{
    const savedVersion=localStorage.getItem('tues_version');
    if(savedVersion!==APP_VERSION){
      localStorage.clear();
      return;
    }
    const t=localStorage.getItem('tues_tasks'); if(t) tasks=JSON.parse(t);
    const p=localStorage.getItem('tues_projects'); if(p) projects=JSON.parse(p);
    const s=localStorage.getItem('tues_staff'); if(s) staff=JSON.parse(s);
    nextId=parseInt(localStorage.getItem('tues_nextId')||String(nextId));
  }catch(e){}
}

function populateFormDropdowns(){
  document.getElementById('nProj').innerHTML='<option value="">Select project…</option>'+projects.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
  document.getElementById('nPerson').innerHTML=staff.map(s=>`<option value="${s}">${s}</option>`).join('');
}

function setView(v){
  view=v;
  ['daily','monthly','annual','all'].forEach((x,i)=>document.querySelectorAll('.tab')[i].classList.toggle('active',x===v));
  render();
}

function dueInfo(due){
  if(!due)return null;
  const d=new Date(due);d.setHours(0,0,0,0);
  const diff=Math.floor((d-today)/86400000);
  if(diff<0)return{label:`Overdue by ${-diff}d`,cls:'due-over'};
  if(diff===0)return{label:'Due today!',cls:'due-soon'};
  if(diff<=3)return{label:`Due in ${diff}d`,cls:'due-soon'};
  return{label:`Due ${due}`,cls:'due-ok'};
}

function fmt12(t){
  if(!t)return'';
  const [h,m]=t.split(':').map(Number);
  const ampm=h>=12?'PM':'AM';
  const hh=h%12||12;
  return`${hh}:${String(m).padStart(2,'0')} ${ampm}`;
}

function addTask(){
  const title=document.getElementById('nTitle').value.trim();
  if(!title){document.getElementById('nTitle').focus();return;}
  const project=document.getElementById('nProj').value||projects[0]?.name||'General';
  const freq=document.getElementById('nFreq').value;
  const person=document.getElementById('nPerson').value||staff[0]||'Me';
  const due=document.getElementById('nDue').value||null;
  const time=document.getElementById('nTime').value||'';
  tasks.push({id:nextId++,title,project,freq,person,due,time,done:false});
  document.getElementById('nTitle').value='';
  document.getElementById('nDue').value='';
  document.getElementById('nTime').value='';
  document.getElementById('nTitle').focus();
  saveData();render();
}

function toggleDone(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;saveData();render();}}
function deleteTask(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);saveData();render();}}
function toggleEdit(id){editingId=editingId===id?null:id;render();}

function saveEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const nt=document.getElementById('et_title_'+id).value.trim();
  if(nt)t.title=nt;
  t.project=document.getElementById('et_proj_'+id).value;
  t.freq=document.getElementById('et_freq_'+id).value;
  t.person=document.getElementById('et_person_'+id).value;
  t.due=document.getElementById('et_due_'+id).value||null;
  t.time=document.getElementById('et_time_'+id).value||'';
  editingId=null;saveData();render();
}

function getProjectStats(projName){
  const src=view==='all'?tasks:tasks.filter(t=>t.freq===view);
  const pt=src.filter(t=>t.project===projName);
  const total=pt.length,done=pt.filter(t=>t.done).length;
  const over=pt.filter(t=>!t.done&&t.due&&new Date(t.due).setHours(0,0,0,0)<today).length;
  return{total,done,remaining:total-done,over,pct:total?Math.round(done/total*100):0};
}

function renderStats(){
  const src=view==='all'?tasks:tasks.filter(t=>t.freq===view);
  const total=src.length,done=src.filter(t=>t.done).length;
  const over=src.filter(t=>!t.done&&t.due&&new Date(t.due).setHours(0,0,0,0)<today).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat s-purple"><div class="stat-label">Total</div><div class="stat-val">${total}</div></div>
    <div class="stat s-teal"><div class="stat-label">Done</div><div class="stat-val">${done}</div></div>
    <div class="stat s-blue"><div class="stat-label">Remaining</div><div class="stat-val">${total-done}</div></div>
    <div class="stat s-red"><div class="stat-label">Overdue</div><div class="stat-val">${over}</div></div>
    <div class="stat s-amber"><div class="stat-label">Progress</div><div class="stat-val">${pct}%</div></div>`;
}

function renderProjectProgress(){
  document.getElementById('projProgressGrid').innerHTML=projects.map(p=>{
    const s=getProjectStats(p.name);
    return`<div class="proj-card" style="border-top-color:${p.color};">
      <div class="pc-header">
        <div class="pc-icon" style="background:${p.color};"><i class="ti ${p.icon||'ti-folder'}"></i></div>
        <div><div class="pc-name">${p.name}</div><div class="pc-short">${s.total} task${s.total!==1?'s':''}</div></div>
      </div>
      <div class="pc-counts">
        <div class="pc-count"><div class="pc-count-val" style="color:${p.color};">${s.done}</div><div class="pc-count-label">Done</div></div>
        <div class="pc-count"><div class="pc-count-val">${s.remaining}</div><div class="pc-count-label">Left</div></div>
        <div class="pc-count"><div class="pc-count-val" style="color:${s.over>0?'#A32D2D':'var(--light)'};">${s.over}</div><div class="pc-count-label">Overdue</div></div>
      </div>
      <div class="pc-bar-wrap"><div class="pc-bar" style="width:${s.pct}%;background:${s.pct===100?'#1D9E75':p.color};"></div></div>
      <div class="pc-pct" style="color:${p.color};">${s.pct}%</div>
    </div>`;
  }).join('');
}

function renderReminder(){
  const urgent=tasks.filter(t=>{
    if(t.done||!t.due)return false;
    return Math.floor((new Date(t.due).setHours(0,0,0,0)-today)/86400000)<=2;
  });
  const el=document.getElementById('reminder');
  if(!urgent.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="reminder">
    <div class="rem-title"><i class="ti ti-bell" style="margin-right:6px;"></i>${urgent.length} task${urgent.length>1?'s':''} need urgent attention</div>
    ${urgent.map(t=>{
      const col=getProjByName(t.project).color;
      const timeStr=t.time?` at ${fmt12(t.time)}`:'';
      return`<div class="rem-item"><span style="color:${col};font-weight:600;">${t.title}</span><span style="color:#aaa;font-size:11px;margin-left:4px;">— ${t.project}${timeStr}</span></div>`;
    }).join('')}
  </div>`;
}

function renderFilters(){
  document.getElementById('projChips').innerHTML=
    ['All',...projects.map(p=>p.name)].map(name=>{
      const active=activeProj===name;
      const p=getProjByName(name);
      const style=active&&name!=='All'?`background:${p.bg};color:${p.color};border-color:${p.color};`
        :active?'background:#F0EFFE;color:#3C3489;border-color:#7F77DD;':'';
      return`<button class="chip" data-proj="${name.replace(/"/g,'&quot;')}" onclick="setProj(this.dataset.proj)" style="${style}">${name==='All'?'🗂 All Projects':name}</button>`;
    }).join('');
  document.getElementById('memberChips').innerHTML=
    ['All',...staff].map(m=>{
      const active=activeMember===m;
      const style=active?'background:#F0EFFE;color:#3C3489;border-color:#7F77DD;':'';
      return`<button class="chip" onclick="setMember('${m}')" style="${style}">${m==='All'?'👥 Everyone':m}</button>`;
    }).join('');
}

function setProj(p){activeProj=p;render();}
function setMember(m){activeMember=m;render();}

function renderTasks(){
  let list=view==='all'?[...tasks]:tasks.filter(t=>t.freq===view);
  if(activeProj!=='All')list=list.filter(t=>t.project===activeProj);
  if(activeMember!=='All')list=list.filter(t=>t.person===activeMember);
  const pending=list.filter(t=>!t.done).sort((a,b)=>{
    const da=a.due?new Date(a.due).getTime():9e12;
    const db=b.due?new Date(b.due).getTime():9e12;
    if(da!==db)return da-db;
    if(a.time&&b.time)return a.time.localeCompare(b.time);
    if(a.time)return -1; if(b.time)return 1;
    return 0;
  });
  const done=list.filter(t=>t.done);
  const all=[...pending,...done];
  if(!all.length){
    document.getElementById('taskList').innerHTML='<div class="empty"><i class="ti ti-mood-happy" style="font-size:32px;display:block;margin-bottom:10px;"></i>No tasks here — add one above!</div>';
    return;
  }
  document.getElementById('taskList').innerHTML=all.map((t,i)=>{
    const p=getProjByName(t.project);
    const di=dueInfo(t.due);
    const isEditing=editingId===t.id;
    const projOpts=projects.map(pr=>`<option value="${pr.name}"${t.project===pr.name?' selected':''}>${pr.name}</option>`).join('');
    const staffOpts=staff.map(s=>`<option value="${s}"${t.person===s?' selected':''}>${s}</option>`).join('');
    const timeBadge=t.time?`<span class="badge b-time"><i class="ti ti-clock" style="font-size:10px;vertical-align:-1px;margin-right:2px;"></i>${fmt12(t.time)}</span>`:'';
    const divider=(i===pending.length&&done.length>0&&pending.length>0)?`<div class="section-divider">✓ Completed</div>`:'';
    return divider+`<div class="task-card ${t.done?'done':''}" style="border-left-color:${p.color};">
      <div class="task-main">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleDone(${t.id})"/>
        <div class="task-info">
          <div class="task-title">${t.title}</div>
          <div class="task-meta">
            <span class="badge b-${t.freq}">${t.freq}</span>
            <span class="badge" style="background:${p.bg};color:${p.color};">${p.short}</span>
            ${t.person?`<span class="badge b-person"><i class="ti ti-user" style="font-size:10px;vertical-align:-1px;margin-right:2px;"></i>${t.person}</span>`:''}
            ${timeBadge}
            ${di?`<span class="${di.cls}"><i class="ti ti-calendar" style="font-size:11px;vertical-align:-1px;margin-right:2px;"></i>${di.label}</span>`:''}
          </div>
        </div>
        <div class="task-btns">
          <button class="icon-btn" onclick="toggleEdit(${t.id})" title="Edit task"><i class="ti ti-pencil"></i></button>
          <button class="icon-btn del" onclick="deleteTask(${t.id})" title="Delete task"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="edit-panel ${isEditing?'open':''}">
        <div class="edit-grid">
          <input class="edit-input" id="et_title_${t.id}" value="${t.title.replace(/"/g,'&quot;')}" placeholder="Task title"/>
          <select class="edit-input" id="et_proj_${t.id}">${projOpts}</select>
        </div>
        <div class="edit-row">
          <select class="edit-input" id="et_freq_${t.id}">
            <option value="daily"${t.freq==='daily'?' selected':''}>Daily</option>
            <option value="monthly"${t.freq==='monthly'?' selected':''}>Monthly</option>
            <option value="annual"${t.freq==='annual'?' selected':''}>Annual</option>
          </select>
          <select class="edit-input" id="et_person_${t.id}">${staffOpts}</select>
        </div>
        <div class="edit-row">
          <input type="date" class="edit-input" id="et_due_${t.id}" value="${t.due||''}" placeholder="Due date"/>
          <input type="time" class="edit-input" id="et_time_${t.id}" value="${t.time||''}" placeholder="Time"/>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="save-btn" onclick="saveEdit(${t.id})"><i class="ti ti-check"></i> Save changes</button>
          <button class="cancel-btn" onclick="toggleEdit(${t.id})">Cancel</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* MODAL */
function openModal(mode){
  modalMode=mode;newProjColor=PALETTE[0];
  document.getElementById('modalTitle').textContent=mode==='projects'?'Manage Projects':'Manage Staff';
  renderModalBody();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}

function renderModalBody(){
  if(modalMode==='projects'){
    const swatches=PALETTE.map(c=>`<div class="color-swatch ${c===newProjColor?'selected':''}" style="background:${c};" onclick="selectColor('${c}')"></div>`).join('');
    const list=projects.map(p=>`<div class="modal-list-item">
      <div class="modal-list-item-dot" style="background:${p.color};"></div>
      <div class="modal-list-item-name">${p.name}</div>
      <button class="modal-list-item-del" onclick="deleteProject('${p.id}')"><i class="ti ti-trash"></i></button>
    </div>`).join('');
    document.getElementById('modalBody').innerHTML=`
      <div class="modal-section">
        <div class="modal-section-title">Current projects</div>
        <div class="modal-list">${list||'<div style="color:var(--light);font-size:13px;">No projects yet</div>'}</div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Add new project</div>
        <div class="color-picker">${swatches}</div>
        <div class="modal-add-row">
          <input type="text" id="newProjName" placeholder="Project name…" onkeydown="if(event.key==='Enter')addProject()"/>
          <button class="mini-add-btn" onclick="addProject()"><i class="ti ti-plus"></i> Add</button>
        </div>
      </div>`;
  } else {
    const list=staff.map((s,i)=>`<div class="modal-list-item">
      <div class="modal-list-item-dot" style="background:#7F77DD;"></div>
      <div class="modal-list-item-name">${s}</div>
      ${s!=='Me'?`<button class="modal-list-item-del" onclick="deleteStaff(${i})"><i class="ti ti-trash"></i></button>`:'<span style="font-size:11px;color:var(--light);">owner</span>'}
    </div>`).join('');
    document.getElementById('modalBody').innerHTML=`
      <div class="modal-section">
        <div class="modal-section-title">Current team members</div>
        <div class="modal-list">${list}</div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Add new staff member</div>
        <div class="modal-add-row">
          <input type="text" id="newStaffName" placeholder="Full name…" onkeydown="if(event.key==='Enter')addStaff()"/>
          <button class="mini-add-btn" onclick="addStaff()"><i class="ti ti-plus"></i> Add</button>
        </div>
      </div>`;
  }
}

function selectColor(c){newProjColor=c;renderModalBody();}

function addProject(){
  const name=document.getElementById('newProjName').value.trim();
  if(!name)return;
  if(projects.find(p=>p.name===name)){alert('Project already exists!');return;}
  projects.push({id:'p'+Date.now(),name,color:newProjColor,bg:hexToBg(newProjColor),short:name.substring(0,5),icon:'ti-folder'});
  saveData();populateFormDropdowns();renderModalBody();render();
}
function deleteProject(id){
  if(!confirm('Delete this project?'))return;
  projects=projects.filter(p=>p.id!==id);
  saveData();populateFormDropdowns();renderModalBody();render();
}
function addStaff(){
  const name=document.getElementById('newStaffName').value.trim();
  if(!name)return;
  if(staff.includes(name)){alert('Already exists!');return;}
  staff.push(name);saveData();populateFormDropdowns();renderModalBody();render();
}
function deleteStaff(i){
  if(!confirm('Remove this staff member?'))return;
  staff.splice(i,1);saveData();populateFormDropdowns();renderModalBody();render();
}

function resetToDefault(){
  if(!confirm('This will clear all saved data and reload the default tasks. Continue?'))return;
  localStorage.clear();
  location.reload();
}

function render(){renderStats();renderProjectProgress();renderReminder();renderFilters();renderTasks();}

document.getElementById('nDue').min=new Date().toISOString().split('T')[0];
loadData();
populateFormDropdowns();
render();
</script>
</body>
</html>
